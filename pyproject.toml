[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Polymarket BTC 5-Min Up/Down Trading Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references", ".venv", "state", "ticks", "runbooks", "build", "dist"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["references", "state", "ticks"]

[tool.mypy]
exclude = ["references/", "state/", "ticks/", "build/", "dist/"]

[dependency-groups]
dev = [
    "anthropic>=0.98.1",
    "httpx>=0.28.1",
    "import-linter>=2.11",
    "matplotlib>=3.10.9",
    "mypy>=1.20.2",
    "polars>=1.40.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "python-dateutil>=2.9.0.post0",
    "ruff>=0.15.12",
]

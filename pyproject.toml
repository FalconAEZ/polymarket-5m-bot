[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Polymarket BTC 5-Min Up/Down Trading Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.98.1",
    "eth-account>=0.13.7",
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "pandas>=2.3.4",
    "polars>=1.40.1",
    "psutil>=7.2.0",
    "py-clob-client>=0.34.6",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "redis>=5.0.0",
    "uvicorn>=0.30.0",
    "websockets>=16.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references", ".venv", "state", "ticks", "runbooks", "build", "dist"]
asyncio_mode = "auto"

[tool.ruff]
# runbooks/patches/ holds verbatim copies of files deployed out-of-tree on the VPS;
# they're for traceability only and are not part of the runtime code path.
extend-exclude = ["references", "state", "ticks", "runbooks/patches"]

[tool.mypy]
exclude = ["references/", "state/", "ticks/", "build/", "dist/"]

[dependency-groups]
dev = [
    "anthropic>=0.98.1",
    "httpx>=0.28.1",
    "import-linter>=2.11",
    "matplotlib>=3.10.9",
    "mypy>=1.20.2",
    "polars>=1.40.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "python-dateutil>=2.9.0.post0",
    "ruff>=0.15.12",
    "types-psutil>=7.2.0",
]

# Streamlit theme — Phase 4.5 dashboard. Dark, dense, financial-tooling palette.
# Per design/dashboard.md §4.3.

[theme]
base = "dark"
primaryColor = "#1ed760"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
runOnSave = false
# Bind to localhost only — no remote access; no auth needed.
address = "127.0.0.1"
port = 8501

[browser]
gatherUsageStats = false

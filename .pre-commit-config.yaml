repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: forbid-todos
        name: forbid TODO/FIXME/hack in committed code (code only — design docs may document them)
        entry: bash -c '! grep -rEn "TODO|FIXME|//\s*hack" src/ tests/ scripts/ 2>/dev/null'
        language: system
        pass_filenames: false
        always_run: true
      - id: file-headers
        name: enforce module docstrings on every src/*.py
        entry: uv run python runbooks/scripts/check_headers.py src/
        language: system
        pass_filenames: false
        always_run: true

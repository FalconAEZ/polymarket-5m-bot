target-version = "py311"
line-length = 100
extend-exclude = ["pdfs", "references", "state", "ticks", "build", "dist"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "S", "PT"]
ignore = ["E501"]

[lint.per-file-ignores]
# S101: `assert` is fine in tests, scripts, and runbook helpers.
# S105/S106: tests use string literals that bandit's heuristic flags as
# potential hardcoded passwords; they are stubs, not real credentials.
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101"]
"runbooks/scripts/*" = ["S101"]
